<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOGIC-LAB // Digital Circuit Workbench &amp; Analysis Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #080C14;
      --bg-surface: #0E1422;
      --bg-surface-elevated: #151D2F;
      --bg-card: #121929;
      --bg-card-subtle: #0B101D;
      
      --border-subtle: #1E293B;
      --border-default: #2A364F;
      --border-strong: #3D4D6B;
      --border-glow: rgba(56, 189, 248, 0.35);

      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --text-dim: #475569;

      --sig-high: #38BDF8;
      --sig-high-glow: rgba(56, 189, 248, 0.35);
      --sig-high-bg: rgba(56, 189, 248, 0.08);
      --sig-high-border: rgba(56, 189, 248, 0.5);

      --sig-accent: #34D399;
      --sig-accent-glow: rgba(52, 211, 153, 0.3);
      --sig-accent-bg: rgba(52, 211, 153, 0.1);

      --sig-low: #334155;
      --sig-low-text: #64748B;

      --alert-warn: #F59E0B;
      --alert-warn-bg: rgba(245, 158, 11, 0.08);

      --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", Consolas, "Courier New", monospace;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;

      --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-medium: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    html, body {
      height: 100%;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

    /* Top Navigation Bar */
    header.lab-header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-default);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #0284C7 0%, #38BDF8 100%);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
      flex-shrink: 0;
    }

    .brand-logo svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #080C14;
      stroke-width: 2.2;
    }

    .brand-info {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      background: rgba(56, 189, 248, 0.12);
      color: var(--sig-high);
      border: 1px solid var(--sig-high-border);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .brand-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Circuit Navigation Tabs */
    nav.circuit-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
    }
    nav.circuit-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.04);
    }

    .tab-btn.active {
      background: var(--bg-card);
      color: var(--sig-high);
      border-color: var(--sig-high-border);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.4), inset 0 0 10px rgba(56, 189, 248, 0.06);
    }

    .tab-btn .tab-ic {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .tab-btn.active .tab-ic {
      color: var(--sig-high);
      opacity: 0.85;
    }

    /* Header Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }

    .score-summary-pill {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-default);
      border-radius: 9999px;
      padding: 5px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
    }

    .score-summary-pill b {
      color: var(--sig-accent);
      font-size: 0.88rem;
    }

    /* Main Container */
    main.lab-main {
      padding: 16px 20px;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      flex: 1;
    }

    .circuit-panel {
      display: none;
      gap: 16px;
    }

    .circuit-panel.active {
      display: grid;
      grid-template-columns: 290px minmax(0, 1.45fr) minmax(0, 1.15fr);
      align-items: start;
    }

    @media (max-width: 1280px) {
      .circuit-panel.active {
        grid-template-columns: 280px 1fr;
      }
      .col-right {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 960px) {
      header.lab-header {
        flex-direction: column;
        align-items: stretch;
      }
      nav.circuit-tabs {
        order: 3;
      }
      .header-actions {
        order: 2;
        margin-left: 0;
        justify-content: space-between;
      }
      .circuit-panel.active {
        display: flex;
        flex-direction: column;
      }
    }

    .col {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    /* Engineering Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 20px;
      right: 20px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
    }

    .card-badge {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-default);
      color: var(--text-muted);
    }

    .card-badge.highlight {
      color: var(--sig-high);
      border-color: var(--sig-high-border);
      background: var(--sig-high-bg);
    }

    /* Left Column: Mission & Scoreboard */
    .mission-statement {
      font-size: 0.94rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.45;
      padding: 10px 12px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      border-left: 3px solid var(--sig-high);
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      width: fit-content;
    }

    .status-indicator.pending {
      background: rgba(148, 163, 184, 0.08);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
    }

    .status-indicator.solved {
      background: var(--sig-accent-bg);
      color: var(--sig-accent);
      border: 1px solid var(--sig-accent);
      box-shadow: 0 0 12px var(--sig-accent-glow);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-indicator.solved .status-dot {
      box-shadow: 0 0 8px currentColor;
    }

    .mission-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all var(--transition-fast);
      border: 1px solid transparent;
      user-select: none;
    }

    .btn-primary {
      background: var(--sig-high);
      color: #080C14;
      font-weight: 700;
      border-color: var(--sig-high);
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.25);
    }

    .btn-primary:hover {
      background: #7DD3FC;
      border-color: #7DD3FC;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35);
    }

    .btn-success {
      background: var(--sig-accent);
      color: #080C14;
      font-weight: 700;
      border-color: var(--sig-accent);
      box-shadow: 0 2px 8px rgba(52, 211, 153, 0.25);
    }

    .btn-success:hover {
      background: #6EE7B7;
    }

    .btn-ghost {
      background: var(--bg-surface-elevated);
      color: var(--text-secondary);
      border-color: var(--border-default);
    }

    .btn-ghost:hover {
      background: var(--border-subtle);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .btn-sm {
      padding: 4px 9px;
      font-size: 0.74rem;
    }

    .feedback-panel {
      font-size: 0.8rem;
      line-height: 1.5;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .feedback-panel.hint {
      background: var(--alert-warn-bg);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #FDE68A;
    }

    .feedback-panel.solution {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
    }

    .feedback-panel code {
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--sig-high);
      word-break: break-all;
    }

    /* Score Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.74rem;
    }

    .metric-cell {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .metric-cell.featured {
      grid-column: 1 / -1;
      background: var(--sig-accent-bg);
      border-color: rgba(52, 211, 153, 0.3);
    }

    .metric-cell.featured b {
      color: var(--sig-accent);
      font-size: 1rem;
    }

    .metric-label {
      color: var(--text-muted);
    }

    .metric-cell b {
      color: var(--text-primary);
    }

    .btn-link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
      text-align: left;
    }

    .btn-link:hover {
      color: var(--text-secondary);
    }

    /* Circuit Part Table / Leaderboard */
    .part-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .part-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: left;
      font: inherit;
      color: inherit;
    }

    .part-item:hover {
      border-color: var(--border-default);
      background: #182338;
    }

    .part-item.active {
      border-color: var(--sig-high);
      background: var(--sig-high-bg);
      box-shadow: inset 3px 0 0 var(--sig-high);
    }

    .part-name {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .part-ic-tag {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .part-score {
      font-family: var(--font-mono);
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--sig-high);
    }

    .part-meta {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .total-strip {
      border-top: 1px solid var(--border-default);
      padding-top: 8px;
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .total-strip b {
      font-size: 1.15rem;
      color: var(--sig-accent);
    }

    /* Interactive Hardware Switch Banks */
    .controls-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: flex-end;
      padding: 10px 14px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
    }

    .switch-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .switch-group-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .switches-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tactile-toggle {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      min-width: 44px;
      height: 48px;
      padding: 4px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: all var(--transition-fast);
      position: relative;
    }

    .tactile-toggle:hover {
      border-color: var(--border-strong);
      background: var(--bg-surface-elevated);
    }

    .tactile-toggle .pin-name {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      line-height: 1;
    }

    .tactile-toggle .pin-val {
      font-family: var(--font-mono);
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1;
      color: var(--sig-low-text);
      transition: color var(--transition-fast);
    }

    .tactile-toggle::after {
      content: "";
      width: 12px;
      height: 2px;
      border-radius: 1px;
      background: var(--border-default);
      transition: all var(--transition-fast);
    }

    .tactile-toggle.high {
      border-color: var(--sig-high);
      background: var(--sig-high-bg);
      box-shadow: 0 0 12px var(--sig-high-glow);
    }

    .tactile-toggle.high .pin-name {
      color: var(--sig-high);
    }

    .tactile-toggle.high .pin-val {
      color: var(--sig-high);
      text-shadow: 0 0 8px var(--sig-high-glow);
    }

    .tactile-toggle.high::after {
      background: var(--sig-high);
      box-shadow: 0 0 6px var(--sig-high);
    }

    .mode-switch-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      transition: border-color var(--transition-fast);
    }

    .mode-switch-pill:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .mode-switch-pill input {
      width: 15px;
      height: 15px;
      accent-color: var(--sig-high);
      cursor: pointer;
    }

    /* Schematic Box & SVG Graphics */
    .schematic-box {
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: auto;
      min-height: 260px;
      position: relative;
    }

    svg.circuit-svg {
      width: 100%;
      height: auto;
      min-width: 420px;
      max-height: 330px;
      display: block;
    }

    .wire {
      stroke: var(--sig-low);
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke var(--transition-fast);
    }

    .wire.high {
      stroke: var(--sig-high) !important;
      filter: drop-shadow(0 0 4px var(--sig-high-glow));
    }

    .wire-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      fill: var(--text-muted);
      user-select: none;
    }

    .wire-label.high {
      fill: var(--sig-high);
      font-weight: 800;
    }

    .gate-body {
      fill: var(--bg-surface-elevated);
      stroke: var(--border-strong);
      stroke-width: 1.8;
      rx: 6;
      transition: all var(--transition-medium);
    }

    .gate-body.active-block {
      stroke: var(--sig-high);
      stroke-width: 2.2;
      filter: drop-shadow(0 0 8px var(--sig-high-glow));
      fill: #132238;
    }

    .gate-title {
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 12px;
      fill: var(--text-primary);
      text-anchor: middle;
      dominant-baseline: central;
    }

    .gate-sub {
      font-family: var(--font-sans);
      font-size: 9px;
      fill: var(--text-muted);
      text-anchor: middle;
    }

    .gate-ic {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      fill: var(--sig-high);
      opacity: 0.8;
      text-anchor: middle;
    }

    .led-node {
      r: 8;
      fill: #1E293B;
      stroke: #475569;
      stroke-width: 2;
      transition: all var(--transition-fast);
    }

    .led-node.lit {
      fill: var(--sig-high);
      stroke: #7DD3FC;
      filter: drop-shadow(0 0 10px var(--sig-high-glow));
    }

    /* Signal Legend */
    .signal-legend {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .legend-indicator {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .legend-indicator.high {
      background: var(--sig-high);
      box-shadow: 0 0 6px var(--sig-high-glow);
    }

    .legend-indicator.low {
      background: var(--sig-low);
    }

    /* Truth Table */

      </div>
    </div>

    <nav class="circuit-tabs" role="tablist" aria-label="Circuit Navigation">
      <button class="tab-btn active" data-circuit="mux41">
        <span>4:1 MUX</span>

      </button>

        <span>3:8 Decoder</span>
        <span class="tab-ic">IC 74138</span>

        <span>8:1 MUX</span>
        <span class="tab-ic">IC 74151</span>
      </button>

    <div class="header-actions">

  </header>

  <!-- Main Multi-Panel Workspace -->
  <main class="lab-main" id="lab-workbench"></main>

  <!-- Modal Container for Enlarge Dialogs -->
  <div id="modal-root"></div>

  <script>
    /* ==========================================================================
       1. PURE LOGIC KERNEL (Verified, Pure Functions)
       ========================================================================== */

    /**
     * 4:1 Multiplexer
     * Y = S1'S0'D0 + S1'S0 D1 + S1 S0'D2 + S1 S0 D3
     */
    function muxOut(d, s) {
      const sel = (s[0] << 1) | s[1];
      return d[sel] & 1;
    }

    /**
     * 1:4 Demultiplexer
     * Passes data Din solely to channel selected by S1, S0
     */
    function demuxOut(din, s) {
      const sel = (s[0] << 1) | s[1];
      const out = [0, 0, 0, 0];
      out[sel] = din & 1;
      return out;
    }

    /**
     * 3:8 Decoder with active-high Enable (EN)
     * Exactly one output Yk = 1 when EN=1, all 0 when EN=0
     */
    function decoderOut(abc, en) {
      const out = [0, 0, 0, 0, 0, 0, 0, 0];
      if ((en & 1) === 0) return out;
      const idx = (abc[0] << 2) | (abc[1] << 1) | abc[2];
      out[idx] = 1;
      return out;
    }

    /**
     * 8:3 Priority Encoder
     * Priority Mode: Highest active index sets output binary code
     * Naive OR Mode: Bitwise collision matrix
     */
    function encoderOut(inputs, priority = true) {
      if (priority) {
        for (let i = 7; i >= 0; i--) {
          if (inputs[i] === 1) {
            return {
              a2: (i >> 2) & 1,
              a1: (i >> 1) & 1,
              a0: i & 1,
              valid: 1,
              winner: i
            };
          }
        }
        return { a2: 0, a1: 0, a0: 0, valid: 0, winner: -1 };
      } else {
        const a2 = inputs[4] | inputs[5] | inputs[6] | inputs[7];
        const a1 = inputs[2] | inputs[3] | inputs[6] | inputs[7];
        const a0 = inputs[1] | inputs[3] | inputs[5] | inputs[7];
        const valid = inputs.some(v => v === 1) ? 1 : 0;
        return { a2, a1, a0, valid, winner: valid ? 99 : -1 };
      }
    }

    /**
     * Composite 8:1 Multiplexer
     * Constructed from dual 4:1 multiplexers steered by S2 selector
     */
    function mux8Out(d, s) {
      const s2 = s[0], s1 = s[1], s0 = s[2];
      const mux0 = muxOut(d.slice(0, 4), [s1, s0]);
      const mux1 = muxOut(d.slice(4, 8), [s1, s0]);
      const finalY = s2 === 0 ? mux0 : mux1;
      return { finalY, mux0, mux1 };
    }

    /* Verification Self-Test */
    function verifyKernel() {
      // 4:1 Mux test
      for (let s = 0; s < 4; s++) {
        const d = [0, 0, 0, 0];
        d[s] = 1;
        if (muxOut(d, [(s >> 1) & 1, s & 1]) !== 1) console.error("SelfTest: 4:1 Mux failed");
      }
      // 1:4 Demux test
      for (let s = 0; s < 4; s++) {
        const res = demuxOut(1, [(s >> 1) & 1, s & 1]);
        if (res[s] !== 1) console.error("SelfTest: 1:4 Demux failed");
      }
      // 3:8 Decoder test
      if (decoderOut([1, 1, 1], 0).some(v => v !== 0)) console.error("SelfTest: Decoder disable failed");
      // 8:3 Priority Encoder test
      const enc = encoderOut([0, 1, 1, 0, 0, 0, 0, 0], true);
      if (enc.winner !== 2 || enc.a1 !== 1 || enc.a0 !== 0) console.error("SelfTest: Encoder priority failed");
    }
    verifyKernel();

    /* ==========================================================================
       2. SYSTEM STATE CONFIGURATION
       ========================================================================== */
    const CIRCUIT_KEYS = ["mux41", "demux14", "decoder38", "encoder83", "mux81"];

    const PART_INFO = {
      mux41: { name: "4:1 Multiplexer", short: "4:1 MUX", ic: "74153", category: "Data Selector" },
      demux14: { name: "1:4 Demultiplexer", short: "1:4 DEMUX", ic: "74139", category: "Data Distributor" },
      decoder38: { name: "3:8 Decoder", short: "3:8 Dec", ic: "74138", category: "Minterm Generator" },
      encoder83: { name: "8:3 Priority Encoder", short: "8:3 Enc", ic: "74148", category: "Priority Resolver" },
      mux81: { name: "8:1 Composite Multiplexer", short: "8:1 MUX", ic: "74151", category: "Composite System" }
    };

    const state = {
      activeTab: "mux41",
      switches: {
        mux41: { d: [0, 0, 1, 0], s: [1, 0] },
        demux14: { din: 1, s: [0, 1] },
        decoder38: { en: 1, abc: [1, 0, 1] },
        encoder83: { inputs: [0, 0, 0, 0, 0, 0, 1, 0], priority: true },
        mux81: { d: [0, 0, 0, 0, 0, 1, 0, 0], s: [1, 0, 1] }
      },
      kmapView: {
        demux14: 1,
        decoder38: 5,
        encoder83: "A1"
      },
      lowerView: {
        mux41: "gates",
        demux14: "gates",
        decoder38: "gates",
        encoder83: "gates",
        mux81: "gates"
      },
      challenge: {},
      score: {},
      lastResult: {},
      loops: {}
    };

    CIRCUIT_KEYS.forEach(k => {
      state.score[k] = { points: 0, solved: 0, skipped: 0, streak: 0, best: 0 };
      state.challenge[k] = null;
      state.lastResult[k] = null;
    });

    function totalPoints() {
      return CIRCUIT_KEYS.reduce((sum, k) => sum + state.score[k].points, 0);
    }

    /* ==========================================================================
       3. MISSION ENGINE
       ========================================================================== */
    const bitFormat = (n, w) => n.toString(2).padStart(w, "0");

    const challengeGenerators = {
      mux41: () => {
        const ch = Math.floor(Math.random() * 4);
        const targetVal = Math.random() > 0.5 ? 1 : 0;
        return {
          text: `Route channel D${ch} to output Y with logic level ${targetVal}.`,
          hint: `Set select lines [S1 S0] to the binary representation of ${ch} (${bitFormat(ch, 2)}), then set input D${ch} to ${targetVal}.`,
          answer: `Select lines [S1 S0] = ${bitFormat(ch, 2)}, Data pin D${ch} = ${targetVal}. Output Y evaluates to ${targetVal}.`,
          check: () => {
            const { d, s } = state.switches.mux41;
            const sel = (s[0] << 1) | s[1];
            return sel === ch && muxOut(d, s) === targetVal && d[ch] === targetVal;
          }
        };
      },
      demux14: () => {
        const targetCh = Math.floor(Math.random() * 4);
        return {
          text: `Distribute input Din = 1 exclusively to output terminal Y${targetCh}.`,
          hint: `Set Din = 1. Encode channel index ${targetCh} onto select lines S1 and S0 in binary.`,
          answer: `Din = 1, [S1 S0] = ${bitFormat(targetCh, 2)}. Only Y${targetCh} asserts logic high.`,
          check: () => {
            const { din, s } = state.switches.demux14;
            const out = demuxOut(din, s);
            return din === 1 && out[targetCh] === 1;
          }
        };
      },
      decoder38: () => {
        const targetM = Math.floor(Math.random() * 8);
        return {
          text: `Assert minterm output Y${targetM} = 1 while preserving system enable.`,
          hint: `Ensure Enable EN = 1. Present binary address ${bitFormat(targetM, 3)} across address inputs [A B C].`,
          answer: `EN = 1, [A B C] = ${bitFormat(targetM, 3)}. Selected minterm m${targetM} asserts 1.`,
          check: () => {
            const { en, abc } = state.switches.decoder38;
            const out = decoderOut(abc, en);
            return en === 1 && out[targetM] === 1;
          }
        };
      },
      encoder83: () => {
        const targetIdx = 1 + Math.floor(Math.random() * 7);
        const code = bitFormat(targetIdx, 3).split("").join(" ");
        return {
          text: `Under active priority resolution, generate address bus [A2 A1 A0] = ${code}.`,
          hint: `Assert input I${targetIdx} high while holding all higher-order inputs (I${targetIdx + 1} through I7) low.`,
          answer: `Assert I${targetIdx} = 1, ensure all I > ${targetIdx} = 0, and confirm priority resolver is active.`,
          check: () => {
            const { inputs, priority } = state.switches.encoder83;
            const res = encoderOut(inputs, priority);
            return priority && res.valid === 1 && res.winner === targetIdx;
          }
        };
      },
      mux81: () => {
        const ch = Math.floor(Math.random() * 8);
        const targetVal = Math.random() > 0.4 ? 1 : 0;
        return {
          text: `Route channel D${ch} across the composite 8:1 bus to yield Y = ${targetVal}.`,
          hint: `Set [S2 S1 S0] to ${bitFormat(ch, 3)}. S2 steers between the lower and upper 4:1 sub-stages.`,
          answer: `[S2 S1 S0] = ${bitFormat(ch, 3)}, pin D${ch} = ${targetVal}.`,
          check: () => {
            const { d, s } = state.switches.mux81;
            const sel = (s[0] << 2) | (s[1] << 1) | s[2];
            const res = mux8Out(d, s);
            return sel === ch && res.finalY === targetVal && d[ch] === targetVal;
          }
        };
      }
    };

    function requestChallenge(circuitKey, isManualSkip) {
      const current = state.challenge[circuitKey];
      const sc = state.score[circuitKey];

      if (isManualSkip && current && !current.solved) {
        sc.skipped += 1;
        sc.streak = 0;
        state.lastResult[circuitKey] = { text: current.text, answer: current.answer };
      } else {
        state.lastResult[circuitKey] = null;
      }

      let nextChal = null;
      for (let attempt = 0; attempt < 30; attempt++) {
        nextChal = challengeGenerators[circuitKey]();
        if (!nextChal.check()) break;
      }
      nextChal.solved = false;
      nextChal.hintShown = false;
      state.challenge[circuitKey] = nextChal;
      updateChallengeView(circuitKey);
    }

    function triggerHint(circuitKey) {
      const chal = state.challenge[circuitKey];
      if (!chal || chal.solved) return;
      chal.hintShown = true;
      updateChallengeView(circuitKey);
    }

    function clearScore(circuitKey) {
      state.score[circuitKey] = { points: 0, solved: 0, skipped: 0, streak: 0, best: 0 };
      updateChallengeView(circuitKey);
    }

    function updateChallengeView(circuitKey) {
      const chal = state.challenge[circuitKey];
      const targetEl = document.getElementById(`target-${circuitKey}`);
      const statusEl = document.getElementById(`status-${circuitKey}`);
      if (!chal || !targetEl || !statusEl) return;

      targetEl.textContent = chal.text;

      const sc = state.score[circuitKey];
      if (!chal.solved && chal.check()) {
        chal.solved = true;
        const awarded = chal.hintShown ? 5 : 10;
        chal.earned = awarded;
        sc.points += awarded;
        sc.solved += 1;
        sc.streak += 1;
        sc.best = Math.max(sc.best, sc.streak);
      }

      if (chal.solved) {
        statusEl.className = "status-indicator solved";
        statusEl.innerHTML = `<span class="status-dot"></span><span>Verified Target (+${chal.earned} pts)</span>`;
      } else {
        statusEl.className = "status-indicator pending";
        statusEl.innerHTML = `<span class="status-dot"></span><span>Target Pending</span>`;
      }

      const nextBtn = document.getElementById(`btn-next-${circuitKey}`);
      if (nextBtn) {
        nextBtn.textContent = chal.solved ? "Proceed to Next Target" : "Skip / New Target";
        nextBtn.className = chal.solved ? "btn btn-success" : "btn btn-ghost";
      }

      const hintBtn = document.getElementById(`btn-hint-${circuitKey}`);
      if (hintBtn) {
        hintBtn.hidden = chal.solved || chal.hintShown;
      }

      const noteBox = document.getElementById(`feedback-${circuitKey}`);
      const last = state.lastResult[circuitKey];
      let noteContent = "";
      if (chal.hintShown && !chal.solved) {
        noteContent += `<div class="feedback-panel hint"><strong>Engineering Clue:</strong> ${chal.hint} <span style="font-size:0.7rem; opacity:0.8;">(Target value adjusted to 5 points)</span></div>`;
      }
      if (last) {
        noteContent += `<div class="feedback-panel solution"><strong>Previous Task:</strong> ${last.text}<br><strong>Reference Solution:</strong> <code>${last.answer}</code></div>`;
      }
      if (noteBox) {
        noteBox.innerHTML = noteContent;
        noteBox.hidden = !noteContent;
      }

      const metricsBox = document.getElementById(`metrics-${circuitKey}`);
      if (metricsBox) {
        metricsBox.innerHTML = `
          <div class="metric-cell featured">
            <span class="metric-label">Points Earned</span>
            <b>${sc.points}</b>
          </div>
          <div class="metric-cell">
            <span class="metric-label">Tasks Solved</span>
            <b>${sc.solved}</b>
          </div>
          <div class="metric-cell">
            <span class="metric-label">Tasks Skipped</span>
            <b>${sc.skipped}</b>
          </div>
          <div class="metric-cell">
            <span class="metric-label">Active Streak</span>
            <b>${sc.streak}</b>
          </div>
          <div class="metric-cell">
            <span class="metric-label">Peak Streak</span>

          <div style="grid-column: 1 / -1; margin-top: 2px;">
            <button class="btn-link" onclick="clearScore('${circuitKey}')">Reset circuit metrics</button>
          </div>
        `;
      }

      const globalVal = document.getElementById("global-score-val");
      if (globalVal) globalVal.textContent = `${totalPoints()} pts`;

      renderPartList();
    }

    function renderPartList() {
      const markup = CIRCUIT_KEYS.map(k => {
        const sc = state.score[k];
        const info = PART_INFO[k];
        const isActive = k === state.activeTab;
        return `
          <button class="part-item ${isActive ? 'active' : ''}" onclick="switchCircuit('${k}')">
            <div>
              <div class="part-name">
                <span>${info.short}</span>
                <span class="part-ic-tag">${info.ic}</span>
              </div>
              <div class="part-meta">Solved ${sc.solved} | Skip ${sc.skipped}</div>
            </div>
            <div class="part-score">${sc.points}</div>
          </button>
        `;
      }).join("");

      CIRCUIT_KEYS.forEach(k => {
        const listEl = document.getElementById(`part-list-${k}`);
        if (listEl) listEl.innerHTML = markup;
        const totalEl = document.getElementById(`part-total-${k}`);
        if (totalEl) totalEl.textContent = `${totalPoints()} pts`;
      });
    }

    /* ==========================================================================
       4. PROCEDURAL GATE SCHEMATIC GENERATOR
       ========================================================================== */
    function renderGateSvg(spec, ic) {
      const PIN_STEP = 11, ROW_GAP = 22, X_OFFSET = 48, GATE_W = 38, OR_W = 42;
      const ctrls = spec.controls, terms = spec.terms, outs = spec.outputs;
      const evaluateLit = l => ctrls[l.c].val ^ (l.neg ? 1 : 0);

      // Evaluate term outputs
      terms.forEach(t => {
        const litVals = t.lits.map(evaluateLit);
        if (t.direct) litVals.unshift(t.direct.val);
        t.nIn = litVals.length;
        t.val = litVals.every(v => v === 1) ? 1 : 0;
      });
      outs.forEach(o => {
        o.val = o.terms.some(idx => terms[idx].val) ? 1 : 0;
      });

      // Horizontal bus distribution
      let currentX = X_OFFSET + 12;
      ctrls.forEach(c => {
        c.xt = currentX + 6;
        if (c.comp) {
          c.xc = c.xt + 34;
          currentX += 48;
        } else {
          currentX += 24;
        }
      });
      const xAnd = currentX + 12;
      const xTermOut = xAnd + GATE_W;

      // Vertical positions for control rails
      ctrls.forEach((c, idx) => { c.y = 16 + idx * ROW_GAP; });
      let currentY = 16 + ctrls.length * ROW_GAP + 12;

      terms.forEach(t => {
        t.isGate = t.nIn >= 2;
        t.h = t.isGate ? (t.nIn * PIN_STEP + 6) : 12;
        t.y = currentY;
        t.yOut = t.y + t.h / 2;
        currentY += t.h + (t.isGate ? 8 : 5);
      });
      const termsBottom = currentY;

      const calcPinY = (t, k) => t.isGate ? (t.y + 3 + PIN_STEP * (k + 0.5)) : (t.y + 6);

      // Term-to-OR Routing Lanes
      const orOutputs = outs.filter(o => o.terms.length >= 2);
      const usedTermIndices = [];
      orOutputs.forEach(o => o.terms.forEach(idx => {
        if (!usedTermIndices.includes(idx)) usedTermIndices.push(idx);
      }));

      const laneMap = {};
      usedTermIndices.forEach((tIdx, n) => {
        laneMap[tIdx] = xTermOut + 14 + n * 6;
      });
      const xOr = xTermOut + 14 + usedTermIndices.length * 6 + 14;
      const xLed = xOr + OR_W + 20;

      orOutputs.forEach(o => {
        o.h = Math.max(2, o.terms.length) * PIN_STEP + 6;
        o.desiredY = o.terms.reduce((acc, i) => acc + terms[i].yOut, 0) / o.terms.length - o.h / 2;
      });

      let cursorY = 0;
      [...orOutputs].sort((a, b) => a.desiredY - b.desiredY).forEach(o => {
        o.y = Math.max(o.desiredY, cursorY, 16 + ctrls.length * ROW_GAP + 12);
        cursorY = o.y + o.h + 12;
      });

      const totalW = xLed + 84;
      const totalH = Math.max(termsBottom, cursorY) + 12;

      const drawPath = (d, isHigh) => `<path d="${d}" class="wire ${isHigh ? 'high' : ''}"/>`;
      const drawDot = (cx, cy, isHigh) => `<circle cx="${cx}" cy="${cy}" r="2.8" class="dot ${isHigh ? 'high' : ''}"/>`;

      let wireSvg = "", gateSvg = "", labelSvg = "";

      // Render control inputs & buses
      ctrls.forEach((c, idx) => {
        let maxTrueY = c.y, maxCompY = c.y;
        terms.forEach(t => {
          let k = t.direct ? 1 : 0;
          t.lits.forEach(l => {
            if (l.c === idx) {
              const py = calcPinY(t, k);
              if (l.neg) maxCompY = Math.max(maxCompY, py);
              else maxTrueY = Math.max(maxTrueY, py);
            }
            k++;
          });
        });

        wireSvg += drawPath(`M${X_OFFSET - 4} ${c.y} H${c.xt}`, c.val);
        if (maxTrueY > c.y) wireSvg += drawPath(`M${c.xt} ${c.y} V${maxTrueY}`, c.val);
        labelSvg += `<text x="4" y="${c.y + 3.5}" class="g-label ${c.val ? 'high' : ''}">${c.name}=${c.val}</text>`;

        if (c.comp) {
          wireSvg += drawPath(`M${c.xt} ${c.y} H${c.xt + 4}`, c.val);
          gateSvg += `<path d="M${c.xt + 4} ${c.y - 6} V${c.y + 6} L${c.xt + 20} ${c.y} Z" class="gate-body ${c.val ? '' : 'active-block'}"/>`
                   + `<circle cx="${c.xt + 23}" cy="${c.y}" r="3" class="gate-body ${c.val ? '' : 'active-block'}"/>`;
          wireSvg += drawPath(`M${c.xt + 26} ${c.y} H${c.xc}`, 1 - c.val);
          if (maxCompY > c.y) wireSvg += drawPath(`M${c.xc} ${c.y} V${maxCompY}`, 1 - c.val);
          wireSvg += drawDot(c.xt, c.y, c.val);
        } else if (maxTrueY > c.y) {
          wireSvg += drawDot(c.xt, c.y, c.val);
        }
      });

      // Render term logic
      terms.forEach(t => {
        let k = 0;
        if (t.direct) {
          const py = calcPinY(t, 0);
          wireSvg += drawPath(`M${X_OFFSET - 4} ${py} H${xAnd}`, t.direct.val);
          labelSvg += `<text x="4" y="${py + 3.5}" class="g-label ${t.direct.val ? 'high' : ''}">${t.direct.name}=${t.direct.val}</text>`;
          k = 1;
        }
        t.lits.forEach(l => {
          const c = ctrls[l.c], py = calcPinY(t, k), branchX = l.neg ? c.xc : c.xt, litVal = evaluateLit(l);
          wireSvg += drawPath(`M${branchX} ${py} H${xAnd + (t.isGate ? 0 : GATE_W)}`, litVal);
          wireSvg += drawDot(branchX, py, litVal);
          k++;
        });
        if (t.isGate) {
          gateSvg += `<path d="M${xAnd} ${t.y} H${xAnd + 18} A18 ${t.h / 2} 0 0 1 ${xAnd + 18} ${t.y + t.h} H${xAnd} Z" class="gate-body ${t.val ? 'active-block' : ''}"/>`;
        }
      });

      // Render OR outputs
      orOutputs.forEach(o => {
        o.terms.forEach((tIdx, j) => {
          const t = terms[tIdx], py = o.y + 3 + PIN_STEP * (j + 0.5);
          wireSvg += drawPath(`M${xTermOut} ${t.yOut} H${laneMap[tIdx]} V${py} H${xOr + 8}`, t.val);
        });
        gateSvg += `<path d="M${xOr} ${o.y} Q${xOr + OR_W * 0.5} ${o.y} ${xOr + OR_W} ${o.y + o.h / 2} Q${xOr + OR_W * 0.5} ${o.y + o.h} ${xOr} ${o.y + o.h} Q${xOr + OR_W * 0.3} ${o.y + o.h / 2} ${xOr} ${o.y} Z" class="gate-body ${o.val ? 'active-block' : ''}"/>`;
        o.yOut = o.y + o.h / 2;
        wireSvg += drawPath(`M${xOr + OR_W} ${o.yOut} H${xLed - 6}`, o.val);
      });

      usedTermIndices.forEach(tIdx => {
        const count = orOutputs.filter(o => o.terms.includes(tIdx)).length;
        if (count > 1) wireSvg += drawDot(laneMap[tIdx], terms[tIdx].yOut, terms[tIdx].val);
      });

      // Output indicators
      outs.forEach(o => {
        let outY = o.terms.length >= 2 ? o.yOut : terms[o.terms[0]].yOut;
        if (o.terms.length < 2) {
          wireSvg += drawPath(`M${xTermOut} ${outY} H${xLed - 6}`, terms[o.terms[0]].val);
        }
        gateSvg += `<circle cx="${xLed}" cy="${outY}" r="7" class="led-node ${o.val ? 'lit' : ''}"/>`;
        labelSvg += `<text x="${xLed + 14}" y="${outY + 4}" class="g-label ${o.val ? 'high' : ''}">${o.name}=${o.val}</text>`;
      });

      return `<svg class="gate-svg" viewBox="0 0 ${totalW} ${totalH}" role="img" aria-label="${spec.title}">
        ${wireSvg}${gateSvg}${labelSvg}
        ${ic ? `<text x="${totalW - 6}" y="12" text-anchor="end" class="g-ic">${ic} Logic Core</text>` : ""}
      </svg>`;
    }

    function getGateSpecMux41() {
      const { d, s } = state.switches.mux41;
      const terms = [0, 1, 2, 3].map(k => ({
        direct: { name: `D${k}`, val: d[k] },
        lits: [{ c: 0, neg: ((k >> 1) & 1) === 0 }, { c: 1, neg: (k & 1) === 0 }]
      }));
      return {
        title: "4:1 Multiplexer Gate Schematic",
        controls: [{ name: "S1", val: s[0], comp: true }, { name: "S0", val: s[1], comp: true }],
        terms,
        outputs: [{ name: "Y", terms: [0, 1, 2, 3] }]
      };
    }

    function getGateSpecDemux14() {
      const { din, s } = state.switches.demux14;
      const terms = [0, 1, 2, 3].map(k => ({
        lits: [{ c: 0, neg: false }, { c: 1, neg: ((k >> 1) & 1) === 0 }, { c: 2, neg: (k & 1) === 0 }]
      }));
      return {
        title: "1:4 Demultiplexer Gate Schematic",
        controls: [
          { name: "Din", val: din, comp: false },
          { name: "S1", val: s[0], comp: true },
          { name: "S0", val: s[1], comp: true }
        ],
        terms,
        outputs: [0, 1, 2, 3].map(k => ({ name: `Y${k}`, terms: [k] }))
      };
    }

    function getGateSpecDecoder38() {
      const { en, abc } = state.switches.decoder38;
      const terms = [0, 1, 2, 3, 4, 5, 6, 7].map(k => ({
        lits: [
          { c: 0, neg: false },
          { c: 1, neg: ((k >> 2) & 1) === 0 },
          { c: 2, neg: ((k >> 1) & 1) === 0 },
          { c: 3, neg: (k & 1) === 0 }
        ]
      }));
      return {
        title: "3:8 Decoder Gate Schematic",
        controls: [
          { name: "EN", val: en, comp: false },
          { name: "A", val: abc[0], comp: true },
          { name: "B", val: abc[1], comp: true },
          { name: "C", val: abc[2], comp: true }
        ],
        terms,
        outputs: [0, 1, 2, 3, 4, 5, 6, 7].map(k => ({ name: `Y${k}`, terms: [k] }))
      };
    }

    function getGateSpecMux81() {
      const { d, s } = state.switches.mux81;
      const terms = [0, 1, 2, 3, 4, 5, 6, 7].map(k => ({
        direct: { name: `D${k}`, val: d[k] },
        lits: [
          { c: 0, neg: ((k >> 2) & 1) === 0 },
          { c: 1, neg: ((k >> 1) & 1) === 0 },
          { c: 2, neg: (k & 1) === 0 }
        ]
      }));
      return {
        title: "8:1 Multiplexer Gate Schematic",
        controls: [
          { name: "S2", val: s[0], comp: true },
          { name: "S1", val: s[1], comp: true },
          { name: "S0", val: s[2], comp: true }
        ],
        terms,
        outputs: [{ name: "Y", terms: [0, 1, 2, 3, 4, 5, 6, 7] }]
      };
    }

    function getGateSpecEncoder83() {
      const { inputs, priority } = state.switches.encoder83;
      const valAt = k => inputs[k];
      if (!priority) {
        const controls = [7, 6, 5, 4, 3, 2, 1, 0].map(k => ({ name: `I${k}`, val: valAt(k), comp: false }));
        const cIdx = k => 7 - k;
        const terms = [7, 6, 5, 4, 3, 2, 1, 0].map(k => ({ lits: [{ c: cIdx(k), neg: false }] }));
        const tIdx = k => cIdx(k);
        return {
          title: "8:3 Encoder (Naive OR Mode) Gate Schematic",
          controls,
          terms,
          outputs: [
            { name: "A2", terms: [tIdx(4), tIdx(5), tIdx(6), tIdx(7)] },
            { name: "A1", terms: [tIdx(2), tIdx(3), tIdx(6), tIdx(7)] },
            { name: "A0", terms: [tIdx(1), tIdx(3), tIdx(5), tIdx(7)] },
            { name: "V", terms: [7, 6, 5, 4, 3, 2, 1, 0].map(tIdx) }
          ]
        };
      }

      const compSet = new Set([6, 5, 4, 2]);
      const controls = [7, 6, 5, 4, 3, 2, 1, 0].map(k => ({ name: `I${k}`, val: valAt(k), comp: compSet.has(k) }));
      const c = k => 7 - k;
      const terms = [7, 6, 5, 4, 3, 2, 1, 0].map(k => ({ lits: [{ c: c(k), neg: false }] }));
      const T = k => c(k);

      const addTerm = lits => {
        terms.push({ lits: lits.map(([k, neg]) => ({ c: c(k), neg })) });
        return terms.length - 1;
      };

      const a1_1 = addTerm([[5, true], [4, true], [3, false]]);
      const a1_2 = addTerm([[5, true], [4, true], [2, false]]);
      const a0_1 = addTerm([[6, true], [5, false]]);
      const a0_2 = addTerm([[6, true], [4, true], [3, false]]);
      const a0_3 = addTerm([[6, true], [4, true], [2, true], [1, false]]);

      return {
        title: "8:3 Priority Encoder Gate Schematic",
        controls,
        terms,
        outputs: [
          { name: "A2", terms: [T(7), T(6), T(5), T(4)] },
          { name: "A1", terms: [T(7), T(6), a1_1, a1_2] },
          { name: "A0", terms: [T(7), a0_1, a0_2, a0_3] },
          { name: "V", terms: [7, 6, 5, 4, 3, 2, 1, 0].map(T) }
        ]
      };
    }

    const gateSpecMap = {
      mux41: getGateSpecMux41,
      demux14: getGateSpecDemux14,
      decoder38: getGateSpecDecoder38,
      encoder83: getGateSpecEncoder83,
      mux81: getGateSpecMux81
    };

    /* ==========================================================================
       5. PHYSICAL DIP-16 IC PINOUT RENDERER
       ========================================================================== */
    function renderPinoutSvg(ic) {
      const calcRowY = i => 50 + i * 26;
      const leftPins = ic.pins.slice(0, 8);
      const rightPins = ic.pins.slice(8).reverse();

      const renderPinItem = (p, i, side) => {
        const y = calcRowY(i), isLeft = side === "L";
        const stub1 = isLeft ? 68 : 272, stub2 = isLeft ? 104 : 236;
        const badgeX = isLeft ? 48 : 274;
        const nameX = isLeft ? 44 : 298, nameAnchor = isLeft ? "end" : "start";
        const numX = isLeft ? 110 : 230, numAnchor = isLeft ? "start" : "end";

        const strokeColor = p.val === 1 ? "var(--sig-high)" : p.val === 0 ? "var(--sig-low)" : "var(--border-default)";
        const badgeFill = p.val === 1 ? "var(--sig-high)" : p.val === 0 ? "var(--border-default)" : "none";
        const roleClass = p.role + (p.val === 1 && p.role !== "nc" ? " hi" : "");
        const textDeco = p.bar ? ' style="text-decoration: overline"' : "";

        return `
          <line x1="${stub1}" y1="${y}" x2="${stub2}" y2="${y}" stroke="${strokeColor}" stroke-width="3" stroke-linecap="round" />
          <rect x="${badgeX}" y="${y - 8}" width="18" height="16" rx="4" fill="${badgeFill}" stroke="${p.val === null ? 'var(--border-subtle)' : 'none'}" />
          ${p.val === null ? "" : `<text x="${badgeX + 9}" y="${y + 4}" text-anchor="middle" class="p-val">${p.val}</text>`}
          <text x="${numX}" y="${y + 3}" text-anchor="${numAnchor}" class="p-num">${p.n}</text>
          <text x="${nameX}" y="${y + 4}" text-anchor="${nameAnchor}" class="p-name ${roleClass}"${textDeco}>${p.name}</text>
        `;
      };

      return `
        <svg class="pin-svg" viewBox="0 0 340 274" role="img" aria-label="${ic.chip} DIP-16 Package">
          <path d="M104 36 H236 V250 H104 Z" fill="var(--bg-surface-elevated)" stroke="var(--border-strong)" stroke-width="2" rx="4" />
          <!-- Notch -->
          <path d="M161 36 A9 9 0 0 0 179 36" fill="var(--bg-card)" stroke="var(--border-strong)" stroke-width="2" />
          <text x="170" y="134" text-anchor="middle" class="p-chip">${ic.chip}</text>
          <text x="170" y="150" text-anchor="middle" class="p-sub">${ic.sub}</text>
          <text x="170" y="164" text-anchor="middle" class="p-sub">DIP-16</text>
          ${leftPins.map((p, idx) => renderPinItem(p, idx, "L")).join("")}
          ${rightPins.map((p, idx) => renderPinItem(p, idx, "R")).join("")}
        </svg>
      `;
    }

    const pinSpecHelper = (n, name, role, val, bar) => ({ n, name, role, val: val === undefined ? null : val, bar: !!bar });
    const ncPinHelper = (n, name, bar) => pinSpecHelper(n, name, "nc", null, bar);

    function getPinSpecMux41() {
      const { d, s } = state.switches.mux41;
      const y = muxOut(d, s);
      return {
        chip: "74153",
        sub: "Dual 4:1 Multiplexer",
        pins: [
          pinSpecHelper(1, "1G", "in", 0, true),
          pinSpecHelper(2, "B", "in", s[0]),
          pinSpecHelper(3, "1C3", "in", d[3]),
          pinSpecHelper(4, "1C2", "in", d[2]),
          pinSpecHelper(5, "1C1", "in", d[1]),
          pinSpecHelper(6, "1C0", "in", d[0]),
          pinSpecHelper(7, "1Y", "out", y),
          pinSpecHelper(8, "GND", "pwr"),
          ncPinHelper(9, "2Y"),
          ncPinHelper(10, "2C0"),
          ncPinHelper(11, "2C1"),
          ncPinHelper(12, "2C2"),
          ncPinHelper(13, "2C3"),
          pinSpecHelper(14, "A", "in", s[1]),
          ncPinHelper(15, "2G", true),
          pinSpecHelper(16, "VCC", "pwr")
        ],
        note: "Unit 1 configured. S1 maps to pin B (2) and S0 maps to pin A (14). Active-low Strobe 1G (pin 1) tied to GND."
      };
    }

    function getPinSpecDemux14() {
      const { din, s } = state.switches.demux14;
      const sel = (s[0] << 1) | s[1];
      const outVal = k => (k === sel ? din : 1);
      return {
        chip: "74139",
        sub: "Dual 1:4 Demultiplexer",
        pins: [
          pinSpecHelper(1, "1G", "in", din, true),
          pinSpecHelper(2, "1A", "in", s[1]),
          pinSpecHelper(3, "1B", "in", s[0]),
          pinSpecHelper(4, "1Y0", "out", outVal(0), true),
          pinSpecHelper(5, "1Y1", "out", outVal(1), true),
          pinSpecHelper(6, "1Y2", "out", outVal(2), true),
          pinSpecHelper(7, "1Y3", "out", outVal(3), true),
          pinSpecHelper(8, "GND", "pwr"),
          ncPinHelper(9, "2Y3", true),
          ncPinHelper(10, "2Y2", true),
          ncPinHelper(11, "2Y1", true),
          ncPinHelper(12, "2Y0", true),
          ncPinHelper(13, "2B"),
          ncPinHelper(14, "2A"),
          ncPinHelper(15, "2G", true),
          pinSpecHelper(16, "VCC", "pwr")
        ],
        note: "Data applied through active-low enable 1G. Selected channel reflects data input; unselected channels default high."
      };
    }

    function getPinSpecDecoder38() {
      const { en, abc } = state.switches.decoder38;
      const out = decoderOut(abc, en);
      const outVal = k => 1 - out[k];
      return {
        chip: "74138",
        sub: "3:8 Inverting Decoder",
        pins: [
          pinSpecHelper(1, "A", "in", abc[2]),
          pinSpecHelper(2, "B", "in", abc[1]),
          pinSpecHelper(3, "C", "in", abc[0]),
          pinSpecHelper(4, "G2A", "in", 0, true),
          pinSpecHelper(5, "G2B", "in", 0, true),
          pinSpecHelper(6, "G1", "in", en),
          pinSpecHelper(7, "Y7", "out", outVal(7), true),
          pinSpecHelper(8, "GND", "pwr"),
          pinSpecHelper(9, "Y6", "out", outVal(6), true),
          pinSpecHelper(10, "Y5", "out", outVal(5), true),
          pinSpecHelper(11, "Y4", "out", outVal(4), true),
          pinSpecHelper(12, "Y3", "out", outVal(3), true),
          pinSpecHelper(13, "Y2", "out", outVal(2), true),
          pinSpecHelper(14, "Y1", "out", outVal(1), true),
          pinSpecHelper(15, "Y0", "out", outVal(0), true),
          pinSpecHelper(16, "VCC", "pwr")
        ],
        note: "Pin A is LSB (Address bit C). Triple-gate enable: G1 asserted high with G2A & G2B grounded. Outputs are active-low."
      };
    }

    function getPinSpecEncoder83() {
      const { inputs } = state.switches.encoder83;
      const res = encoderOut(inputs, true);
      const invIn = k => 1 - inputs[k];
      const hasActive = res.valid ? 1 : 0;
      return {
        chip: "74148",
        sub: "8:3 Priority Encoder",
        pins: [
          pinSpecHelper(1, "I4", "in", invIn(4), true),

    /* ==========================================================================
       6. KARNAUGH MAP LOOP ENGINE
       ========================================================================== */
    const KMAP_LOOP_COLORS = ["#38BDF8", "#34D399", "#FBBF24", "#A78BFA"];

    function getContiguousRuns(indices) {
      const sorted = [...indices].sort((a, b) => a - b);
      const result = [];
      sorted.forEach(val => {
        const lastRun = result[result.length - 1];
        if (lastRun && val === lastRun[lastRun.length - 1] + 1) {
          lastRun.push(val);
        } else {
          result.push([val]);
        }
      });
      return result;
    }

    function drawKmapLoops(circuitKey) {
      const container = document.getElementById(`kmap-wrap-${circuitKey}`);
      if (!container) return;
      const table = container.querySelector("table.kmap-grid");
      if (!table || !table.offsetParent) return;

      let stage = table.parentElement;
      if (!stage.classList.contains("kmap-stage")) {
        stage = document.createElement("div");
        stage.className = "kmap-stage";
        table.parentElement.insertBefore(stage, table);
        stage.appendChild(table);
      }

      stage.querySelectorAll(".kloop").forEach(el => el.remove());
      const stageRect = stage.getBoundingClientRect();

      (state.loops[circuitKey] || []).forEach((group, gIdx) => {
        const inset = group.nest ? (2 + (gIdx % 4) * 3) : 3;
        getContiguousRuns(group.rows).forEach(rowRun => {
          getContiguousRuns(group.cols).forEach(colRun => {
            const firstCell = table.rows[rowRun[0] + 1].cells[colRun[0] + 1].getBoundingClientRect();
            const lastCell = table.rows[rowRun[rowRun.length - 1] + 1].cells[colRun[colRun.length - 1] + 1].getBoundingClientRect();

            const loopDiv = document.createElement("div");
            loopDiv.className = "kloop";
            loopDiv.style.cssText = `
              left: ${firstCell.left - stageRect.left + inset}px;
              top: ${firstCell.top - stageRect.top + inset}px;
              width: ${lastCell.right - firstCell.left - 2 * inset}px;
              height: ${lastCell.bottom - firstCell.top - 2 * inset}px;
              --lc: ${KMAP_LOOP_COLORS[group.color % 4]};
            `;
            stage.appendChild(loopDiv);
          });
        });
      });
    }

    window.addEventListener("resize", () => drawKmapLoops(state.activeTab));

    function renderCurrentView() {
      const active = state.activeTab;
      if (active === "mux41") renderMux41View();
      else if (active === "demux14") renderDemux14View();
      else if (active === "decoder38") renderDecoder38View();
      else if (active === "encoder83") renderEncoder83View();
      else if (active === "mux81") renderMux81View();
    }

    function toggleSwitch(circuitKey, group, index) {
      const sw = state.switches[circuitKey];
      if (index !== undefined) {
        sw[group][index] = sw[group][index] ? 0 : 1;
      } else {
        sw[group] = sw[group] ? 0 : 1;
      }
      renderCurrentView();
    }

    function switchCircuit(circuitKey) {
      state.activeTab = circuitKey;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.circuit === circuitKey);
      });
      document.querySelectorAll(".circuit-panel").forEach(panel => {
        panel.classList.toggle("active", panel.id === `panel-${circuitKey}`);
      });
      renderCurrentView();
    }

              <div class="metrics-grid" id="metrics-${ck}"></div>
            </section>

            <section class="card">
              <div class="card-head">
                <span class="card-title">Circuit Leaderboard</span>
              </div>
              <div class="part-list" id="part-list-${ck}"></div>
              <div class="total-strip">
                <span>Aggregate Workbench</span>
                <b id="part-total-${ck}">0 pts</b>
              </div>
            </section>
          </div>

          <!-- Center Column: Block Schematics & Interactive Controls -->
          <div class="col">
            <section class="card">
              <div class="card-head">
                <div class="card-title-group">
                  <span class="card-title">Interactive Schematic &amp; Bus Controls</span>
                </div>
                <div style="display:flex; align-items:center; gap:12px;">
                  <div class="signal-legend">
                    <span class="legend-item"><span class="legend-indicator high"></span>High (1)</span>
                    <span class="legend-item"><span class="legend-indicator low"></span>Low (0)</span>
                  </div>
                  <span class="card-badge">${info.ic} Equivalent</span>
                </div>
              </div>

              <div class="controls-strip" id="controls-${ck}"></div>
              <div class="schematic-box" id="schematic-${ck}"></div>

              <div class="waveform-bar">
                <div class="waveform-channel"><span>Signal Integrity:</span> <b>NOMINAL</b></div>
                <div class="waveform-channel"><span>Logic Standard:</span> <b>TTL 5.0V / CMOS COMPLIANT</b></div>
              </div>
            </section>

            <section class="card">
              <div class="card-head">
                <span class="card-title">Live Dynamic Truth Table</span>
                <span class="card-badge">Synchronized to Inputs</span>
              </div>
              <div class="table-container">
                <table class="truth-table" id="table-${ck}"></table>
              </div>
            </section>
          </div>

          <!-- Right Column: K-Maps, Gate Diagrams & IC Pinout -->
          <div class="col col-right">
            <section class="card">
              <div class="card-head">
                <span class="card-title">Karnaugh Map Minimization</span>
              </div>
              <div id="kmap-${ck}"></div>
            </section>

            <section class="card">
              <div class="card-head">
                <div class="seg-control" role="group" aria-label="Diagram Type Selector">
                  <button class="seg-btn active" id="seg-gates-${ck}" onclick="switchLowerView('${ck}', 'gates')">Gate Schematic</button>
                  <button class="seg-btn" id="seg-pins-${ck}" onclick="switchLowerView('${ck}', 'pins')">IC Pinout (DIP-16)</button>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                  <button class="btn btn-ghost btn-sm" onclick="openDiagramModal('${ck}')" title="Inspect enlarged diagram">Enlarge</button>
                </div>
              </div>

              <div class="lower-viewport">
                <div class="gate-scroll-view" id="gates-${ck}"></div>
                <div class="pinout-view" id="pins-${ck}" hidden></div>
              </div>
            </section>
          </div>
        `;

        container.appendChild(panel);
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      buildWorkbenchDOM();

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => switchCircuit(btn.dataset.circuit));
      });

      CIRCUIT_KEYS.forEach(ck => requestChallenge(ck, false));

      renderMux41View();
      renderDemux14View();
      renderDecoder38View();
      renderEncoder83View();
      renderMux81View();
    });
  </script>
</body>
</html>
